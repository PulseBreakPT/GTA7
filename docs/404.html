<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#fffdf9">
  <meta name="description" content="GTA LORE — the full GTA VI encyclopedia and original design is available at lusorae.pt.">
  <link rel="canonical" href="https://lusorae.pt/">
  <meta http-equiv="refresh" content="0; url=https://lusorae.pt/">
  <title>GTA LORE | Open the full GTA VI encyclopedia</title>
  <script>
    (function () {
      var original = window.location.pathname;
      var path = /^\/GTA7(?:\/|$)/i.test(original) ? original.slice(5) : '/';
      if (!path || path === '/index.html' || path === '/404.html') path = '/';
      var target = new URL('https://lusorae.pt/');
      target.pathname = path;
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.href);
    })();
  </script>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffdf9;color:#182025}
    main{padding:32px;max-width:500px;text-align:center}
    .mark{font-size:12px;font-weight:800;letter-spacing:.25em;color:#b03f45}
    h1{font-size:clamp(32px,6vw,46px);line-height:1.1;margin:18px 0}
    p{color:#4b5563;line-height:1.65}
    a{display:inline-block;padding:14px 22px;margin-top:10px;background:#b03f45;color:white;font-weight:700;border-radius:6px;text-decoration:none}
    a:focus-visible{outline:3px solid #111;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="mark">GTA LORE / GRAND THEFT AUTO VI</div>
    <h1>Continue to GTA LORE</h1>
    <p>The full encyclopedia, including the original design, is hosted at lusorae.pt. You will be redirected automatically.</p>
    <a href="https://lusorae.pt/">Open the full GTA LORE site &rarr;</a>
  </main>
</body>
</html>
