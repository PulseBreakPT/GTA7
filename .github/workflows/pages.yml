name: Publish original GTA LORE to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "hooks/**"
      - "public/**"
      - "sources/**"
      - "scripts/**"
      - "package.json"
      - "yarn.lock"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "jsconfig.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Export original Next.js design
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare static Pages version
        run: node scripts/prepare-github-pages.mjs

      - name: Repair Pages-only navigation
        run: node scripts/fix-pages-navigation.mjs

      - name: Build the actual GTA LORE interface
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: ./node_modules/.bin/next build .pages-export

      - name: Validate exported site and image assets
        run: |
          test -s .pages-export/out/index.html
          test -s .pages-export/out/wiki/index.html
          test -s .pages-export/out/database/characters/index.html
          test -s .pages-export/out/media/key-art/jason-lucia-car.webp
          grep -q 'Welcome to' .pages-export/out/index.html
          touch .pages-export/out/.nojekyll

      - name: Validate Pages-specific navigation
        run: node scripts/validate-pages-export.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload full static export
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-export/out

  deploy:
    name: Deploy original GTA LORE design
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://pulsebreakpt.github.io/GTA7/
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
