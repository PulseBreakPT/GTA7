log_format gtalore_safe '$time_iso8601 "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=gtalore_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=gtalore_auth:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=gtalore_connections:10m;

