server {
    server_name lusorae.pt www.lusorae.pt;

    access_log /var/log/nginx/leonida.access.log gtalore_safe;
    error_log /var/log/nginx/leonida.error.log warn;
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_hide_header X-Powered-By;

    location /_next/static/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/auth/ {
        limit_req zone=gtalore_auth burst=10 nodelay;
        limit_conn gtalore_connections 12;
        client_max_body_size 32k;
        limit_except GET POST PATCH DELETE OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=gtalore_api burst=30 nodelay;
        limit_conn gtalore_connections 20;
        client_max_body_size 1k;
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_conn gtalore_connections 30;
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/lusorae.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lusorae.pt/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name lusorae.pt www.lusorae.pt;
    return 308 https://lusorae.pt$request_uri;
}
